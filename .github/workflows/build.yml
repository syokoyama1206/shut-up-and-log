name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest :composeApp:assembleDebug :composeApp:verifyCommonMainLogDatabaseMigration
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - run: xcodebuild -project iosApp/ShutUpAndLog.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
